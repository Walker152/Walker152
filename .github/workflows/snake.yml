name: Generate contribution snake

on:
  # Every day
  schedule:
    - cron: "17 0 * * *"

  # Allow manual execution
  workflow_dispatch:

  # Generate once when this workflow is committed
  push:
    branches:
      - main
    paths:
      - README.md
      - .github/workflows/snake.yml

concurrency:
  group: contribution-snake
  cancel-in-progress: true

permissions: {}

jobs:
  generate:
    permissions:
      contents: write

    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate GitHub contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}

          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push snake to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5.0.0
        with:
          target_branch: output
          build_dir: dist

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
